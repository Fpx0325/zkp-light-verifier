[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zkp-light-verifier"
version = "1.0.0"
description = "A lightweight Schnorr proof verifier with CLI, HTTP API and audit statistics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "pydantic>=2.7,<3", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
zkp-verify = "zkp_verifier.cli:main"

[tool.setuptools.packages.find]
include = ["zkp_verifier*"]
